services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fylune
      POSTGRES_USER: fylune
      POSTGRES_PASSWORD: fylune
    ports:
      - "55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fylune -d fylune"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - fylune-postgres:/var/lib/postgresql/data

volumes:
  fylune-postgres:
